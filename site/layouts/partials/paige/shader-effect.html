<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    // =========================================================================
    // 🎛️ RECALIBRATED "00 HALO" PRESET
    // =========================================================================
    const CONFIG = {
        type: 'plane',           
        
        // Recalibrated colors to match the glowing aesthetic in the tool
        color1: '#4ef2d2',       // Vibrant Mint/Turquoise
        color2: '#fff5a1',       // Bright Lemon Yellow
        color3: '#ffffff',       // Pure Crisp White
        
        uSpeed: 0.4,             
        uDensity: 1.8,           
        uStrength: 4.0,          
        uFrequency: 5.5,         
        uAmplitude: 1.0,         
        
        // Rotations converted to Euler vectors for the correct diagonal sweep
        positionX: -1.4,         
        positionY: 0.0,          
        positionZ: 0.0,          
        rotationX: 0.5,          
        rotationY: 0.2,          
        rotationZ: 0.8,          
        
        cDistance: 3.6,          
        fov: 45,                 
        brightness: 1.1,         
        pixelDensity: 0.9,       
        
        grain: 'on',             
        grainBlending: 0.07      
    };

    const container = document.getElementById('shader-gradient-wrapper');
    const canvas = document.getElementById('shader-gradient-canvas');
    if (!canvas) return;

    // --- Vertex Shader ---
    const vertexShader = `
        uniform float uTime;
        uniform float uSpeed;
        uniform float uDensity;
        uniform float uStrength;
        uniform float uFrequency;
        uniform float uAmplitude;
        varying vec2 vUv;
        varying float vNoise;

        vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
        vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

        float snoise(vec3 v){ 
            const vec2 C = vec2(1.0/6.0, 1.0/3.0) ;
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy) );
            vec3 x0 = v - i + dot(i, C.xxx) ;
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + 1.0 * C.xxx;
            vec3 x2 = x0 - i2 + 2.0 * C.xxx;
            vec3 x3 = x0 - D.yyy;
            i = mod(i, 289.0 ); 
            vec4 p = permute( permute( permute( 
                        i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            float n_ = 1.0/7.0;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }

        void main() {
            vUv = uv;
            vec3 noisePos = vec3(position.xyz * uDensity);
            noisePos.xy += sin(position.yx * uFrequency + (uTime * uSpeed)) * uAmplitude;
            noisePos.z += uTime * uSpeed;
            vNoise = snoise(noisePos);
            vec3 newPosition = position + normal * (vNoise * uStrength);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
        }
    `;

    // --- Fragment Shader ---
    const fragmentShader = `
        uniform float uTime;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        uniform float uGrainStrength;
        uniform bool uUseGrain;
        uniform float uBrightness;
        varying vec2 vUv;
        varying float vNoise;

        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
        }

        void main() {
            float n = (vNoise + 1.0) * 0.5;
            vec3 mixedColor = mix(uColor1, uColor2, vUv.x);
            mixedColor = mix(mixedColor, uColor3, n);
            mixedColor *= uBrightness;

            if (uUseGrain) {
                vec2 staticUV = gl_FragCoord.xy;
                float staticNoise = random(staticUV + uTime);
                float grain = (staticNoise - 0.5) * uGrainStrength;
                mixedColor += vec3(grain);
            }
            gl_FragColor = vec4(mixedColor, 1.0);
        }
    `;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(CONFIG.fov, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.z = CONFIG.cDistance;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio * CONFIG.pixelDensity);
    renderer.setSize(container.clientWidth, container.clientHeight);

    const geometry = new THREE.PlaneGeometry(20, 15, 256, 256);
    
    const uniforms = {
        uTime: { value: 0 },
        uSpeed: { value: CONFIG.uSpeed },
        uDensity: { value: CONFIG.uDensity },
        uStrength: { value: CONFIG.uStrength },
        uFrequency: { value: CONFIG.uFrequency },
        uAmplitude: { value: CONFIG.uAmplitude },
        uGrainStrength: { value: CONFIG.grainBlending },
        uUseGrain: { value: CONFIG.grain === 'on' },
        uBrightness: { value: CONFIG.brightness },
        uColor1: { value: new THREE.Color(CONFIG.color1) },
        uColor2: { value: new THREE.Color(CONFIG.color2) },
        uColor3: { value: new THREE.Color(CONFIG.color3) }
    };

    const material = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: uniforms,
        side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(CONFIG.positionX, CONFIG.positionY, CONFIG.positionZ);
    mesh.rotation.set(CONFIG.rotationX, CONFIG.rotationY, CONFIG.rotationZ);
    scene.add(mesh);

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        uniforms.uTime.value = clock.getElapsedTime();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
});
</script>
