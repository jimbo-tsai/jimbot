<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    /* MASTER FONT INJECTION: Guarantees asset availability regardless of component nesting */
    @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@200;300;400;500;600;700&display=swap');

    /* 0. NEW COLOR PALETTE SYSTEM */
    :root {
        --clr-dark: #60435f;   /* Dark Plum */
        --clr-medium: #d67ab1; /* Petal Pink */
        --clr-light: #e2a3c7;  /* Blush Pop */
        --clr-bg: #fdf7fa;     /* Header & Body Base Tone */
        --clr-teal: #a8dcd9;   /* Teal */
    }
    
    /* ULTRA-ROBUST FIXED NAVIGATION SYSTEM */
    #paige-header {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        z-index: 1040 !important;
        background-color: #fdf7fa !important; 
        border: none !important;
        /* 🚀 FIXED: Removed box-shadow entirely to eliminate the fake shade line split */
        box-shadow: none !important; 
    }

    /* Strips away hidden white theme background utilities inside the header bar context */
    #paige-header * {
        background-color: transparent !important;
    }

    /* Restores background properties to the drop menu container so links stay legible */
    #paige-header .dropdown-menu,
    #paige-header .dropdown-menu * {
        background-color: #fdf7fa !important;
    }
    
    /* 1. GLOBAL BASELINE & POSITION COMPENSATOR */
    html, body, p, div, a, li, span, input, h1, h2, h3, .navbar-brand, .nav-link {
        font-family: 'Lexend Deca', sans-serif !important;
        -webkit-font-smoothing: antialiased;
    }

    /* 🚀 FIXED: Applied absolute color uniformity to the body and layout framework wrappers */
    html body,
    #wrapper, 
    #main, 
    .main-container, 
    .page-wrapper, 
    #page,
    #paige-root, 
    #paige-content, 
    .paige-container, 
    main {
        background-color: #fdf7fa !important;
    }

    html body {
        padding-top: 95px !important; 
        height: auto !important;
        min-height: 100vh !important;
        overflow: visible !important;
        overflow-y: auto !important;
    }

    /* 2. STANDARD & TITLE WEIGHT */
    h1, h2, h3, .navbar-brand, .title-weight, .lexend-font p {
        font-family: 'Lexend Deca', sans-serif !important;
        font-weight: 300 !important;
    }

    /* 3. LOW-PRIORITY WEIGHT */
    .color-change-target p, 
    #video-section-container p, 
    .contact-urbanist h3,
    .low-priority {
        font-family: 'Lexend Deca', sans-serif !important;
        font-weight: 300 !important;
    }

    /* 4. BRANDING ANCHOR */
    .navbar-brand {
        font-weight: 300 !important;
    }

    /* Base setup for the animated elements */
    .header-grow {
        transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), color 0.3s ease !important;
        display: inline-block;
    }

    /* Specific selector forcing Name & Icons to strictly use Teal on hover */
    #paige-header a.header-grow:hover {
        transform: scale(1.08) !important;
        color: var(--clr-teal) !important; 
    }

    /* Main menu links hover Pink, without touching Name/Icons */
    #paige-header a:not(.header-grow):hover,
    .nav-link:hover {
        color: var(--clr-medium) !important;
        transition: color 0.3s ease;
    }

    /* HIGH-SPECIFICITY OVERRIDE SYSTEM FOR ACTIVE/CURRENT LINKS */
    #paige-header a.active,
    #paige-header .active > a,
    #paige-header .nav-link.active,
    #paige-header a[aria-current="page"],
    #paige-header .nav-item.active a,
    #paige-header a[class*="active"],
    #paige-header a[class*="current"],
    #paige-header [class*="active"] > a,
    #paige-header [class*="current"] > a,
    #paige-header .current a,
    #paige-header .nav-link[class*="active"] {
        color: var(--clr-medium) !important;
        opacity: 1 !important;
    }

    /* --- DROPDOWN POSITIONING & FADING ANIMATION --- */
    @keyframes paigeDropdownFadeIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .dropdown {
        position: relative;
    }

    .dropdown-menu {
        top: 100% !important;
        left: 0 !important;
        position: absolute !important;
        margin-top: 0.3rem !important; 
        border: none !important;
        border-radius: 6px !important;
        padding: 0.6rem 1.2rem !important;
        min-width: 130px !important;
        box-shadow: 0 12px 32px rgba(96, 67, 95, 0.08) !important; 
        display: none;
    }

    .dropdown-menu.show {
        display: block !important;
        animation: paigeDropdownFadeIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
    }

    .dropdown-item {
        color: var(--clr-dark) !important;
        padding: 0.35rem 0 !important;
        transition: color 0.2s ease !important;
    }

    .dropdown-menu a:hover,
    .dropdown-item:hover {
        color: var(--clr-medium) !important;
    }

    /* 5. GLOBAL WINDOW SCROLL RESET */
    #wrapper, #main, .main-container, .page-wrapper, #page,
    #paige-root, #paige-content, .paige-container, main {
        height: auto !important;
        min-height: 100vh !important;
        overflow: visible !important;
        overflow-y: visible !important;
    }
</style>

<header id="paige-header" class="container-fluid py-3 px-4 px-lg-5">
    <div class="d-flex align-items-center justify-content-between">

        <div style="flex: 1; text-align: left;">
            <a class="navbar-brand header-grow" 
               href="{{ .Site.BaseURL }}" 
               style="font-family: 'Lexend Deca', sans-serif !important; font-weight: 700 !important; font-size: 1.4rem; letter-spacing: 0.05rem; color: var(--clr-dark); text-decoration: none; line-height: 1;">
                JIMMY TSAI
            </a>
        </div>

        <div style="flex: 0 1 auto;">
            {{ partial "paige/menu.html" . }}
        </div>
        
        <div style="flex: 1; text-align: right;">
            <div class="d-flex justify-content-end gap-3">
                <a href="https://www.youtube.com/channel/UCQulP0uyasw93322XVnpvZQ" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="header-grow"
                   style="color: var(--clr-dark); text-decoration: none;">
                    <i class="bi bi-youtube" style="font-size: 1.5rem;"></i>
                </a>
                <a href="https://www.instagram.com/jimbot.tsai" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="header-grow"
                   style="color: var(--clr-dark); text-decoration: none;">
                    <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
                </a>
            </div>
        </div>

    </div>
</header>
