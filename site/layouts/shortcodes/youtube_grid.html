<div class="row row-cols-1 g-4 justify-content-center bottom-video-grid" style="max-width: 800px; margin: 0 auto;">
  {{ range $id, $title := .Params }}
    <div class="col" style="margin-bottom: 4vh;">
      <div class="jimmy-video-aspect-container shadow-sm" style="position: relative;">
        <div class="video-wrapper" data-id="{{ $id }}" onclick="loadVideo(this)" style="cursor: pointer; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
          
          <img src="https://img.youtube.com/vi/{{ $id }}/maxresdefault.jpg" alt="Video Poster" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          
          <div class="play-button" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 68px; height: 48px; transition: transform 0.2s ease;">
            <svg viewBox="0 0 68 48" style="width:100%; height:100%; fill:#f00;"><path d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,0.13,34,0,34,0S12.21,0.13,6.9,1.55 c-2.93,0.78-4.64,3.26-5.42,6.19C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z"></path><path d="M 45,24 27,14 27,34" fill="white"></path></svg>
          </div>

        </div>
      </div>
      <p style="font-family: 'Lexend Deca', sans-serif; font-size: 0.9rem; color: #555555; margin-top: 1.5vh; text-align: center; letter-spacing: 0.03em;">
        {{ $title }}
      </p>
    </div>
  {{ end }}
</div>

<script>
  function loadVideo(element) {
    const videoId = element.getAttribute('data-id');
    const iframe = document.createElement('iframe');
    
    iframe.setAttribute('src', `https://www.youtube.com/embed/${videoId}?autoplay=1`);
    iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.style.position = 'absolute';
    iframe.style.top = '0';
    iframe.style.left = '0';
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = '0';
    
    const container = element.parentElement;
    container.innerHTML = '';
    container.appendChild(iframe);
  }
</script>
